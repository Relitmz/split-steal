# ¿Cuánto conviene perdonar? ¿Es 1/3 el óptimo (Nowak y Sigmund)?
# Se cambia la probabilidad de perdón `p` de ForgivingTitForTat, con y sin ruido.
# Sin ruido casi nunca hay nada que perdonar entre amables: el efecto debería verse con ruido.
# Comparar:  split-steal compare results/experiments/perdon_optimo --strategies ForgivingTitForTat

name = "perdon_optimo"
description = "Barrido de p de ForgivingTitForTat (0 = TitForTat, 1 = AlwaysSplit) × ruido"
seeds = 50

[base]
format = "round_robin"
roster = "cooperativas_con_traidores"

[sweep]
"ForgivingTitForTat.p" = [0.0, 0.1, 0.2, 0.333333, 0.5, 0.7, 1.0]
noise = [0.0, 0.05]
